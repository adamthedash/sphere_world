[package]
name = "sphere_world"
version = "0.1.0"
edition = "2024"

default-run = "main"

[dependencies]
bevy = {version = "0.19", features= ["dynamic_linking", "bevy_feathers"]}

bevy_egui = "0.40"
env_logger = "0.11"
glam = "0.32"
hexasphere = "18.0"
itertools = "0.14"
log = "0.4"
noise = "0.9"
num = "0.4"
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
perf = ["bevy/trace", "bevy/trace_chrome"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

